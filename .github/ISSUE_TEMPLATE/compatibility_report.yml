name: Compatibility report
description: Report a Windows, Blender, upstream, or Codex compatibility result.
title: "[compat] "
labels: [compatibility]
body:
  - type: input
    id: launcher
    attributes:
      label: Launcher version or commit
    validations:
      required: true
  - type: textarea
    id: matrix
    attributes:
      label: Compatibility matrix entry
      description: Include Windows, Blender, Python, upstream, uv, and Codex CLI versions.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands and sanitized results
      description: Include `bmcpw doctor --json`, `bmcpw status`, and the relevant launch/configure command. Remove private values.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
