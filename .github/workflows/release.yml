name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to validate and publish"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  GITLEAKS_VERSION: v8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run release gate tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run source safety audit
        run: python scripts/check_security.py
      - name: Build release artifact
        run: python scripts/build_release.py --output-dir dist/release
      - name: Upload cross-runtime release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blender-mcp-release-${{ matrix.python-version }}
          path: dist/release/*

  powershell:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ps-runtime: powershell51
            ps-exe: powershell.exe
          - ps-runtime: powershell7
            ps-exe: pwsh.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run PowerShell entry-point checks (${{ matrix.ps-runtime }})
        shell: cmd
        run: ${{ matrix.ps-exe }} -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\test_powershell.ps1
      - name: Run fresh-machine smoke test (${{ matrix.ps-runtime }})
        shell: cmd
        run: ${{ matrix.ps-exe }} -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\test_fresh_machine.ps1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks from official release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITLEAKS_VERSION#v}"
          curl --fail --silent --show-error --location \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file=gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Secret scan current tree
        shell: bash
        run: ./gitleaks dir . --redact --no-banner
      - name: Secret scan full git history
        shell: bash
        run: ./gitleaks git . --log-opts="--all" --redact --no-banner

  reproducibility:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blender-mcp-release-*
          path: dist/matrix
          merge-multiple: false
      - name: Verify cross-Python release digest
        run: python scripts/verify_reproducible_release.py dist/matrix

  publish:
    needs: [gate, powershell, secret-scan, reproducibility]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build publication artifact
        run: python scripts/build_release.py --output-dir dist
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: blender-mcp-windows-compat ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: false
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
